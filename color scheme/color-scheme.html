<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Sunset Color Scheme</title>
</head>

<body>

    <p><strong>By Ruzgar Savas</strong></p>

    <h1> Color Scheme</h1>

    <img src="colorful-sunset-over-the-sea-scacciamosche.jpg" alt="colorful sunset over the sea" width="350px">

    <br><br>

    <table border="1">
        <caption style="font-family:Georgia, serif; font-size:24px; font-weight:bold; text-decoration:underline;">Sea Sunset</caption>

        <tr>
            <th style="background-color:#8EBDF2; padding:12px;">Sky Blue</th>
            <th style="background-color:#E8976D; padding:12px;">Sunset Orange</th>
            <th style="background-color:#EBCC98; padding:12px;">Golden Light</th>
            <th style="background-color:#414A6D; color:white; padding:12px;">Deep Ocean</th>
        </tr>

        <tr>
            <td>#8EBDF2</td>
            <td>#E8976D</td>
            <td>#EBCC98</td>
            <td>#414A6D</td>
        </tr>

        <tr>
            <td>rgb(142,189,242)</td>
            <td>rgb(232,151,109)</td>
            <td>rgb(235,204,152)</td>
            <td>rgb(65,74,109)</td>
        </tr>

        <tr>
            <td>hsl(212,79%,75%)</td>
            <td>hsl(20,73%,67%)</td>
            <td>hsl(38,67%,76%)</td>
            <td>hsl(228,25%,34%)</td>
        </tr>

    </table>

</body>
</html>
