<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Busy Day Schedule</title>

    <style>

        table {
            width:500px;
            margin:auto;
            border:3px solid #414A6D;
            border-collapse:collapse;
            background-color:#F2F5F9;
        }

        th {
            background-color:#414A6D;
            color:#FFFFFF;
            padding:10px;
            border:2px solid #000000;
        }

        td {
            padding:10px;
            border:2px solid #000000;
        }

        .timeColumn {
            background-color:#DCE8F5;
        }

        tr.important {
            background-color:#F5D6A5;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <h1>My Busy Day Schedule</h1>

    <table>

        <colgroup>
            <col class="timeColumn">
            <col>
        </colgroup>

        <tr>
            <th>Time</th>
            <th>Event</th>
        </tr>

        <tr>
            <td>7:00 AM</td>
            <td>Wake up and get ready</td>
        </tr>

        <tr>
            <td>7:30 AM</td>
            <td>Eat breakfast</td>
        </tr>

        <tr>
            <td>8:00 AM</td>
            <td>Start school work</td>
        </tr>

        <tr>
            <td>10:30 AM</td>
            <td>Take a short break</td>
        </tr>

        <tr>
            <td>12:30 PM</td>
            <td>Eat lunch</td>
        </tr>

        <tr class="important">
            <td>2:00 PM</td>
            <td>Finish important assignments</td>
        </tr>

        <tr>
            <td>4:00 PM</td>
            <td>Go to the gym</td>
        </tr>

        <tr>
            <td>6:30 PM</td>
            <td>Eat dinner</td>
        </tr>

        <tr>
            <td>8:00 PM</td>
            <td>Study and review lessons</td>
        </tr>

        <tr>
            <td>10:30 PM</td>
            <td>Get ready for bed</td>
        </tr>

    </table>

</body>

</html>
