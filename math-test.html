<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Test</title>
</head>

<body>

    <p><strong>By Ruzgar Savas</strong></p>

    <h1>Math Test</h1>

    <!-- START OF TEST -->

    <form>

        <fieldset>
            <legend>Your Name</legend>
            Name: <input type="text" name="name" placeholder="Enter your name">
        </fieldset>

        <fieldset>
            <legend>Question 1</legend>
            <p>What is 6 &times; 2?</p>
            <input type="radio" name="q1" value="10">10<br>
            <input type="radio" name="q1" value="12">12<br>
            <input type="radio" name="q1" value="14">14<br>
            <input type="radio" name="q1" value="16">16
        </fieldset>

        <fieldset>
            <legend>Question 2</legend>
            <p>What is &radic;81?</p>
            <input type="radio" name="q2" value="7">7<br>
            <input type="radio" name="q2" value="8">8<br>
            <input type="radio" name="q2" value="9">9<br>
            <input type="radio" name="q2" value="10">10
        </fieldset>

        <fieldset>
            <legend>Question 3</legend>
            <p>What is &frac12; + &frac14;?</p>
            <input type="radio" name="q3" value="1/4">&frac14;<br>
            <input type="radio" name="q3" value="1/2">&frac12;<br>
            <input type="radio" name="q3" value="3/4">&frac34;<br>
            <input type="radio" name="q3" value="1">1
        </fieldset>

        <fieldset>
            <legend>Word Problem</legend>
            <p>A pizza is cut into 8 slices. You eat 3 slices. What fraction of the pizza is left?</p>
            <textarea rows="4" cols="50" placeholder="Type your answer here"></textarea>
        </fieldset>

        <br>

        <button type="submit">Submit Test</button>

    </form>

    <!-- END OF TEST -->

</body>
</html>
